<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Iniciar sesión | Seguridad</title>
    <link rel="stylesheet" th:href="@{/assets/style.css}">
</head>
<body>
<main class="page-shell">
    <section class="card login-card">
        <p class="eyebrow">Seguridad y calidad</p>
        <h1>Iniciar sesión</h1>
        <p class="muted">Ingresa con tu cuenta para consultar el servicio protegido.</p>

        <div class="notice notice-error" role="alert" th:if="${param.error}">
            No se pudo iniciar sesión. Revisa tus credenciales e inténtalo nuevamente.
        </div>
        <div class="notice notice-success" role="status" th:if="${param.logout}">
            Tu sesión se cerró correctamente.
        </div>

        <form th:action="@{/login}" method="post" class="form-stack">
            <label for="username">Usuario</label>
            <input id="username" name="username" type="text" autocomplete="username" required autofocus>

            <label for="password">Contraseña</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required>

            <button type="submit">Entrar</button>
        </form>

        <a class="text-link" th:href="@{/}">Volver al inicio</a>
    </section>
</main>
</body>
</html>
